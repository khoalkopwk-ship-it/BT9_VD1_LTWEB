<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">IOTSTAR SHOP</a>
    </div>

    <nav>
        <a th:href="@{/}">Trang chủ</a>

        <a th:href="@{/dashboard}"
           sec:authorize="isAuthenticated()">
            Dashboard
        </a>
    </nav>

    <div class="account"
         sec:authorize="isAuthenticated()">

        <div class="user-info"
             th:if="${currentUser != null}">
            <strong th:text="${currentUser.fullName}">
                Họ tên
            </strong>

            <small>
                <span th:text="${currentUser.email}">
                    email
                </span>

                ·

                <span th:text="${currentUser.roleName}">
                    role
                </span>
            </small>
        </div>

        <form th:action="@{/logout}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button class="link-button"
                    type="submit">
                Đăng xuất
            </button>
        </form>
    </div>

    <div sec:authorize="isAnonymous()">
        <a class="login-link"
           th:href="@{/login}">
            Đăng nhập
        </a>
    </div>
</header>

</body>
</html>
